name: Build APK
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Secret phải đặt ở cấp job: `env` của riêng một step KHÔNG có trong điều kiện `if` của chính step đó
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      PTCGDB_API_KEY: ${{ secrets.PTCGDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore (if configured)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Build APKs
        working-directory: android
        run: |
          if [ -f "app/release.jks" ]; then
            echo "Release keystore detected, building release + debug + dev..."
            export RELEASE_KEYSTORE_PATH="release.jks"
            ./gradlew assembleRelease assembleDebug assembleDev
          else
            echo "No release keystore configured, building debug + dev..."
            ./gradlew assembleDebug assembleDev
          fi

      - name: Clean Keystore File
        if: always()
        run: rm -f android/app/release.jks

      - name: Upload Release APK
        if: hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: inspection-camera-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: inspection-camera-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: inspection-camera-dev
          path: android/app/build/outputs/apk/dev/app-dev.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Không phát hành bản ký bằng khoá debug ngẫu nhiên của runner: bản cập nhật in-app sẽ báo xung đột chữ ký
          if [ ! -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "::error::Thiếu APK release (chưa cấu hình RELEASE_KEYSTORE_BASE64?). Dừng phát hành."
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "1507DCamera_${{ github.ref_name }}.apk"
          cp android/app/build/outputs/apk/dev/app-dev.apk "1507DCamera_${{ github.ref_name }}_dev.apk"

          gh release create "${{ github.ref_name }}" "1507DCamera_${{ github.ref_name }}.apk" "1507DCamera_${{ github.ref_name }}_dev.apk" --title "1507DCamera ${{ github.ref_name }}" --notes "Bản phát hành ${{ github.ref_name }}" || {
            gh release upload "${{ github.ref_name }}" "1507DCamera_${{ github.ref_name }}.apk" --clobber
            gh release upload "${{ github.ref_name }}" "1507DCamera_${{ github.ref_name }}_dev.apk" --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
