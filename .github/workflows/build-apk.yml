name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inspection-camera-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "1507DCamera_${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" "1507DCamera_${{ github.ref_name }}.apk" --title "1507DCamera ${{ github.ref_name }}" --notes "Bản phát hành ${{ github.ref_name }}" || gh release upload "${{ github.ref_name }}" "1507DCamera_${{ github.ref_name }}.apk" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
